# Throwaway MongoDB for pytest: docker compose -f docker-compose.test.yml up -d
name: dedup-app-test

services:
  mongo:
    image: mongo:8.0.15
    ports: ["27018:27017"]
    tmpfs: [/data/db]  # in RAM: fast, empty after every restart
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      retries: 30
