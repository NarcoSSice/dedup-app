name: dedup-app

x-backend: &backend
  image: dedup-backend
  restart: unless-stopped
  volumes: [images:/data/images]  # shared by api and workers
  environment: &backend-env
    MONGO_URL: mongodb://mongo:27017
    MONGO_DB: ${MONGO_DB:-dedup}
    QDRANT_URL: http://qdrant:6333
    STORAGE_DIR: /data/images
    DUPLICATE_THRESHOLD: ${DUPLICATE_THRESHOLD:-0.80}
  depends_on: [mongo, qdrant]

services:
  api:
    <<: *backend
    build: ./backend  # worker reuses this image
    environment:
      <<: *backend-env
      WORKERS: ${API_WORKERS:-2}
    ports: ["8000:8000"]

  worker:
    <<: *backend
    pull_policy: never
    command: ["python", "app/worker.py"]
    environment:
      <<: *backend-env
      # keep TORCH_THREADS x replicas <= CPU cores: docker compose up --scale worker=N
      TORCH_THREADS: ${TORCH_THREADS:-4}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-32}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [api]

  mongo:
    image: mongo:8.0.15
    ports: ["127.0.0.1:27017:27017"]  # for running the backend from the host
    volumes: [mongo:/data/db]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333"]  # for running the backend from the host
    volumes: [qdrant:/qdrant/storage]

volumes:
  images:
  mongo:
  qdrant:
